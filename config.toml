[author]
  email = 'ictodbory@gmail.com'
  name = 'Odborová organizace pracujících v ICT'

[params]
  title = 'ICT'
  subTitle = 'Union'
  tagLine = 'Trade union of workers in IT & communications.'
  joinCta = 'become a member'
  createWorkplace = 'create a workplace union'
  eventPosterAlt = 'Poster for the event'
  supportEmail = 'support@ictunion.cz'
  supportPhone = '+420 775 319 271'
  publicUrl = 'https://ictunion.cz'
  [params.legal]
    entityName = 'Odborová organizace pracujících v ICT'
    entry = 'https://or.justice.cz/ias/ui/rejstrik-firma.vysledky?subjektId=1130032&typ=UPLNY'
    registrationNumber = '116 57 502'
  [params.social]
    github = 'https://github.com/ictunion'
    twitter = 'https://twitter.com/ictodbory'
    linkedin = 'http://www.linkedin.com/company/ictodbory-ictunion'
    facebook = 'https://www.facebook.com/ictodbory'
    youtube = ''
    mastodon = 'https://witter.cz/@ict_odbory_ict_union'
    instagram = 'https://www.instagram.com/ictodbory/'
  [params.navigation]
    home = "Home"
    aboutUs = "About Us"
    statutes = "Statutes"
    declaration = "ICT Declaration"
    register = "Application"
    events = "Events"
    workplaces = "Workplaces"
    faq = "FAQ"
    statements = "Statements"
    career = "Career"
    forMembers = "For Members"
  [params.about]
    person_1_name = "Barbora Müllerová"
    person_1_description = "Chairperson of ICT Union - contact [bara@ictunion.cz](mailto:bara@ictunion.cz)"
    person_1_photo = "img/bara_photo.webp"
    person_2_name = "Anna Kupcová"
    person_2_description = "Union organizer - contact [anna@ictunion.cz](mailto:anna@ictunion.cz), phone [+420 739 547 927](tel:+420739547927)"
    person_2_photo = "img/anna_photo.webp"
  [params.home]
    participateTitle = "How to participate?"
    membershipTitle = "We provide..."
    eventsTitle = "Upcoming and ongoing events:"
    moreEvents = "See more events"
  [params.footer]
    learnMore = "Learn More"
    socials = "Socials"
    languages = "Languages"
    legal = "Legal"
    legalLink = "ID"
    partners = "Partners"
    contacts = "Contacts"
    licensingNote = '''
    Content is provided under <a target="_blank" href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution 4.0 International</a>.<br>
